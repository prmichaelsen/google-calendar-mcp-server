steps:
  # Build Docker image (Dockerfile handles TypeScript build)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/google-calendar-mcp-server:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/google-calendar-mcp-server:latest'
      - '.'
  
  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/google-calendar-mcp-server:$COMMIT_SHA'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/google-calendar-mcp-server:latest'
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'google-calendar-mcp-server'
      - '--image=gcr.io/$PROJECT_ID/google-calendar-mcp-server:$COMMIT_SHA'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=60s'
      - '--set-env-vars=NODE_ENV=production,LOG_LEVEL=info,PLATFORM_URL=https://agentbase.me,CORS_ORIGIN=https://agentbase.me,GOOGLE_CALENDAR_ID=primary,GOOGLE_SERVICE_ACCOUNT_EMAIL=support@agentbase.me'
      - '--update-secrets=PLATFORM_SERVICE_TOKEN=google-calendar-platform-service-token:latest,GOOGLE_APPLICATION_CREDENTIALS=google-calendar-google-application-credentials:latest'

images:
  - 'gcr.io/$PROJECT_ID/google-calendar-mcp-server:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/google-calendar-mcp-server:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
